- method: set_step_checkpointing
  enabled: false
- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_dispatch_portfolio
  portfolio: compact
  include_stage_agg: true
  cap_portions:
  - 0.25
  include_mid_order_variants: false
  randomized_mid_trials: 0
  randomized_tiebreak_trials: 0
  selection_strategy: best
  selection_obj_slack: 0
  error_if_infeasible: false
  draw_gantt: false
- method: initialize_by_tau_coarsened_cp
  tau_values:
  - 5
  surrogate_tl_nc_multiplier: 0.12
  polish_tl_nc_multiplier: null
  restore_modes:
  - stage_sequence
  - machine_sequence
  polish_profile_modes:
  - stage_sequence
  surrogate_dispatch_before_cp: true
  include_surrogate_dispatch_candidate: true
  surrogate_dispatch_cap_portions:
  - 0.20
  - 0.25
  - 0.30
  surrogate_dispatch_method_list:
  - bn2d_all_stages
  - best_of_mixed_dispatches
  surrogate_dispatch_include_machine_then_job_variants: true
  surrogate_dispatch_candidate_top_k: 20
  surrogate_neh_enabled: true
  surrogate_neh_position: before_cp
  surrogate_neh_tau_values:
  - 5
  surrogate_neh_sources:
  - dispatch
  surrogate_neh_added_batch_sizes:
  - 15
  surrogate_neh_sequential: true
  surrogate_neh_also_solve_dispatch_cp: false
  surrogate_neh_cp_tl_nc_multiplier: 0.0015
  surrogate_neh_use_lns_only: true
  surrogate_neh_minimize_sum_ci_lex: false
  surrogate_neh_cp_tl_nc_multiplier_2nd_obj: null
  surrogate_pw_cp_enabled: true
  surrogate_pw_cp_tau_values:
  - 5
  surrogate_pw_cp_batch_size_ratio: 0.05
  surrogate_pw_cp_unfixed_batch_count_min: 2
  surrogate_pw_cp_unfixed_batch_count_max: 6
  surrogate_pw_cp_step_size: 1
  surrogate_pw_cp_lr_profile_fixed_batch_count: 1
  surrogate_pw_cp_enable_promotion_profile_fixed: true
  surrogate_pw_cp_non_time_fixed_op_time_limit_multiplier: 0.0015
  surrogate_pw_cp_use_lns_only: false
  surrogate_pw_cp_stop_on_no_improvement: false
  solver_thread_cnt: 16
  surrogate_use_lns_only: false
  surrogate_cp_snapshot_solution_limit: 20
  polish_use_lns_only: false
  cp_model_probing_level: 1
  cp_sat_params:
    exploit_best_solution: true
    diversify_lns_params: true
    solution_pool_size: 8
  make_semi_active: true
  save_candidate_artifacts: false
  error_if_infeasible: false
  draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 2
  tl_nc_multiplier: 0.006
  target_stage_mode: all
  stage_insertion_passes: 2
  stage_insertion_max_shift: 4
  machine_insertion_passes: 2
  max_machine_candidates_per_op: 3
  adjacent_swap_passes: 2
  max_adjacent_pairs_per_pass: 100
  error_if_infeasible: false
  draw_gantt: false
- method: apply_retained_stage_cp_lb
  retained_stage_mode: first_n_quantiles_last
  quantile_count: 4
  threads: 16
  tl_nc_multiplier: 0.08
  snapshot_solution_limit: 96
  snapshot_log_progress: false
  log_cp_lb_ub_progress: false
  save_cp_lb_artifacts: false
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 3
  cp_local_repair_top_k: 2
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_extended_rank_variants: true
  include_dynamic_priority: true
  include_piecewise_stage_priority: false
  prune_unproductive_dispatch_candidates: true
  randomized_mixed_rank_trials: 0
  use_retained_cp_snapshot_portfolio: true
  retained_cp_snapshot_top_k: 4
  retained_cp_dispatch_selection_strategy: best_makespan
  retained_cp_dispatch_makespan_slack: 0
  save_cp_dispatch_artifacts: false
  error_if_infeasible: false
  draw_gantt: false
- method: apply_workload_adaptive_retained_stage_cp_lb
  retained_stage_mode: first_topk_bottlenecks_last
  small_extra_bottleneck_count: 3
  large_extra_bottleneck_count: 4
  large_workload_threshold: 1800
  bottleneck_band_radius: 1
  threads: 16
  tl_nc_multiplier: 0.08
  snapshot_solution_limit: 96
  snapshot_log_progress: false
  log_cp_lb_ub_progress: false
  save_cp_lb_artifacts: false
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 3
  cp_local_repair_top_k: 2
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_extended_rank_variants: true
  include_dynamic_priority: true
  include_piecewise_stage_priority: false
  prune_unproductive_dispatch_candidates: true
  randomized_mixed_rank_trials: 0
  use_retained_cp_snapshot_portfolio: true
  retained_cp_snapshot_top_k: 4
  retained_cp_dispatch_selection_strategy: best_makespan
  retained_cp_dispatch_makespan_slack: 0
  save_cp_dispatch_artifacts: false
  error_if_infeasible: false
  draw_gantt: false
- method: set_stage_workload_adaptive_final_time_reserve
  large_workload_threshold: 1800
  large_workload_tl_nc_multiplier: 0.25
  high_stage_min_stage_count: 15
  high_stage_min_workload_size: 1200
  high_stage_tl_nc_multiplier: 0.30
  default_tl_nc_multiplier: 0.20
- method: suffix_probe_portfolio
  # Final 20260522 flow:
  # - Keep Candidate D tau-first / retained-CP backbone.
  # - Small bound gaps follow the stable 0504 path.
  # - Open gaps race only three interpretable probes: 0504-safe, retained-CP sequence,
  #   and bottleneck-stage sequence. This keeps the tail-risk insurance without
  #   the unstable midpoint/delayed/short-cpseed probes.
  solver_thread_cnt: 16
  accept_equal_obj_from_later_lane: false
  commit_equal_obj: true
  run_selected_suffix: true
  log_cp_subproblem_bounds: true
  log_cp_subproblem_progress: false
  min_incumbent_bound_gap_ratio: 0.003
  run_if_bound_missing: true
  fallback_label: safe_0504_fallback
  fallback_steps:
  - &safe_neh10
    method: neh_cp
    name: safe_neh10
    added_batch_size: 10
    job_seq_by_1st_stage: false
    cp_tl_nc_multiplier: 0.005
    profile_fix_by_machine: false
    minimize_sum_ci_lex: true
    cp_tl_nc_multiplier_2nd_obj: 0.0025
    minimize_sum_ci_lin: false
    tighten_ranges: false
    link_job_completion: false
    use_lns_only: true
    make_semi_active_every_cp: true
    solver_thread_cnt: 16
    skip_if_estimated_neh_exceeds_remaining: true
    full_neh_estimate_safety_factor: 1.0
    log_cp_subproblem_bounds: true
    log_cp_subproblem_progress: false
  - &safe_neh15
    method: neh_cp
    name: safe_neh15
    added_batch_size: 15
    job_seq_by_1st_stage: false
    cp_tl_nc_multiplier: 0.005
    profile_fix_by_machine: false
    minimize_sum_ci_lex: true
    cp_tl_nc_multiplier_2nd_obj: 0.0025
    minimize_sum_ci_lin: false
    tighten_ranges: false
    link_job_completion: false
    use_lns_only: true
    make_semi_active_every_cp: true
    solver_thread_cnt: 16
    skip_if_estimated_neh_exceeds_remaining: true
    full_neh_estimate_safety_factor: 1.0
    log_cp_subproblem_bounds: true
    log_cp_subproblem_progress: false
  - &safe_neh20
    method: neh_cp
    name: safe_neh20
    added_batch_size: 20
    job_seq_by_1st_stage: false
    cp_tl_nc_multiplier: 0.005
    profile_fix_by_machine: false
    minimize_sum_ci_lex: true
    cp_tl_nc_multiplier_2nd_obj: 0.0025
    minimize_sum_ci_lin: false
    tighten_ranges: false
    link_job_completion: false
    use_lns_only: true
    make_semi_active_every_cp: true
    solver_thread_cnt: 16
    skip_if_estimated_neh_exceeds_remaining: true
    full_neh_estimate_safety_factor: 1.0
    log_cp_subproblem_bounds: true
    log_cp_subproblem_progress: false
  - &safe_neh25
    method: neh_cp
    name: safe_neh25
    added_batch_size: 25
    job_seq_by_1st_stage: false
    cp_tl_nc_multiplier: 0.01
    profile_fix_by_machine: false
    minimize_sum_ci_lex: true
    cp_tl_nc_multiplier_2nd_obj: 0.0025
    minimize_sum_ci_lin: false
    tighten_ranges: false
    link_job_completion: false
    use_lns_only: true
    make_semi_active_every_cp: true
    solver_thread_cnt: 16
    skip_if_estimated_neh_exceeds_remaining: true
    full_neh_estimate_safety_factor: 1.0
    log_cp_subproblem_bounds: true
    log_cp_subproblem_progress: false
  - &safe_neh30
    method: neh_cp
    name: safe_neh30
    added_batch_size: 30
    job_seq_by_1st_stage: false
    cp_tl_nc_multiplier: 0.01
    profile_fix_by_machine: false
    minimize_sum_ci_lex: true
    cp_tl_nc_multiplier_2nd_obj: 0.0025
    minimize_sum_ci_lin: false
    tighten_ranges: false
    link_job_completion: false
    use_lns_only: true
    make_semi_active_every_cp: true
    solver_thread_cnt: 16
    skip_if_estimated_neh_exceeds_remaining: true
    full_neh_estimate_safety_factor: 1.0
    log_cp_subproblem_bounds: true
    log_cp_subproblem_progress: false
  - &safe_pw005
    method: incremental_pw_cp
    name: safe_pw005
    batch_size_ratio: 0.05
    unfixed_batch_count_min: 2
    unfixed_batch_count_max: 8
    increment_unfixed_batch_count_flag: if_no_improvement
    non_time_fixed_op_time_limit_multiplier: 0.008
    lr_profile_fixed_batch_count: 1
    enable_promotion_profile_fixed: true
    solver_thread_cnt: 16
    use_lns_only: false
  - &safe_pw009
    method: incremental_pw_cp
    name: safe_pw009
    batch_size_ratio: 0.09
    unfixed_batch_count_min: 2
    unfixed_batch_count_max: 8
    increment_unfixed_batch_count_flag: if_no_improvement
    non_time_fixed_op_time_limit_multiplier: 0.006
    lr_profile_fixed_batch_count: 1
    enable_promotion_profile_fixed: true
    solver_thread_cnt: 16
    use_lns_only: false
  lanes:
  - name: safe_0504_first_neh
    probe_steps:
    - *safe_neh10
    suffix_steps:
    - *safe_neh15
    - *safe_neh20
    - *safe_neh25
    - *safe_neh30
    - *safe_pw005
    - *safe_pw009
  - name: retained_cp_sequence_first_neh
    probe_steps:
    - method: neh_cp
      name: retained_seq_neh10_probe
      added_batch_size: 10
      job_seq_by_1st_stage: false
      job_seq_by_last_retained_cp: true
      retained_cp_sequence_fallback: bottleneck
      cp_tl_nc_multiplier: 0.006
      profile_fix_by_machine: false
      minimize_sum_ci_lex: true
      cp_tl_nc_multiplier_2nd_obj: 0.0025
      minimize_sum_ci_lin: false
      tighten_ranges: false
      link_job_completion: false
      use_lns_only: true
      make_semi_active_every_cp: true
      solver_thread_cnt: 16
      max_added_batch_count: 8
      skip_if_estimated_neh_exceeds_remaining: true
      full_neh_estimate_safety_factor: 1.0
      log_cp_subproblem_bounds: true
      log_cp_subproblem_progress: false
    suffix_steps:
    - *safe_neh15
    - *safe_neh20
    - *safe_neh25
    - *safe_neh30
    - *safe_pw005
    - *safe_pw009
  - name: bottleneck_stage_first_neh
    probe_steps:
    - method: neh_cp
      name: bottleneck_stage_neh10_probe
      added_batch_size: 10
      job_seq_by_1st_stage: false
      job_seq_by_bottleneck_stage: true
      cp_tl_nc_multiplier: 0.006
      profile_fix_by_machine: false
      minimize_sum_ci_lex: true
      cp_tl_nc_multiplier_2nd_obj: 0.0025
      minimize_sum_ci_lin: false
      tighten_ranges: false
      link_job_completion: false
      use_lns_only: true
      make_semi_active_every_cp: true
      solver_thread_cnt: 16
      max_added_batch_count: 8
      skip_if_estimated_neh_exceeds_remaining: true
      full_neh_estimate_safety_factor: 1.0
      log_cp_subproblem_bounds: true
      log_cp_subproblem_progress: false
    suffix_steps:
    - *safe_neh15
    - *safe_neh20
    - *safe_neh25
    - *safe_neh30
    - *safe_pw005
    - *safe_pw009
- method: solve_base_cp_model_from_final_time_reserve
  computational_time: null
  solver_thread_cnt: 16
  use_lns_only: true
  consume_all_remaining: true
  tighten_ranges: true
  link_job_completion: true
  cp_model_probing_level: 1
  cp_sat_params:
    exploit_best_solution: true
    diversify_lns_params: true
    solution_pool_size: 8
  log_search_progress: false
