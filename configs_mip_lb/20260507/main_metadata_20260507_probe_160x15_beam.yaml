# Full-flow probe for hard 160x15 positives with a workload-guarded sequence beam.
pra_common_params_rel_path: "resources/ff2020_common_params.yaml"
baseline_csv_path: "resources/ff2020big_ref/fan2023.csv"
input_dir: "resources/ff2020big"
benchmark_idx_list:
  - 39
  - 87
  - 111
benchmark_filename_format: "{}.txt"

dicts_of_i_o_data_path:
  - stopping_criteria_rel_path: "configs_mip_lb/stopping_criteria_2nc.yaml"
    subroutine_flow_rel_path: "configs_mip_lb/20260507/subroutine_flow_20260507-final-negative-with-workload-beam-2nc.yaml"
    output_dir: "ff2020/20260507-probe-160x15-workload-beam-2nc"
