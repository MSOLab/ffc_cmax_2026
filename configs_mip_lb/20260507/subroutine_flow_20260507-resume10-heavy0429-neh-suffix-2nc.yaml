- method: set_random_seed
  seed: 42
- method: set_step_checkpointing
  enabled: true
- method: set_final_time_reserve
  tl_nc_multiplier: 0.25
- method: neh_cp
  added_batch_size: 10
  job_seq_by_1st_stage: false
  cp_tl_nc_multiplier: 0.05
  profile_fix_by_machine: false
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.005
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  use_lns_only: true
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
  max_added_batch_count: 8
  skip_if_estimated_neh_exceeds_remaining: true
  full_neh_estimate_safety_factor: 1.0
  min_remaining_nc_after_neh: 0.30
  log_cp_subproblem_bounds: true
  log_cp_subproblem_progress: false
- method: neh_cp
  added_batch_size: 20
  job_seq_by_1st_stage: false
  job_seq_by_bottleneck_stage: false
  preserved_head_job_portion: 0.0
  cp_tl_nc_multiplier: 0.05
  profile_fix_by_machine: false
  machine_precedence_stride: 1
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.005
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
  use_lns_only: true
  error_if_infeasible: false
  draw_gantt: false
  max_added_batch_count: 8
  skip_if_estimated_neh_exceeds_remaining: true
  full_neh_estimate_safety_factor: 1.0
  min_remaining_nc_after_neh: 0.25
  log_cp_subproblem_bounds: true
  log_cp_subproblem_progress: false
- method: neh_cp
  added_batch_size: 20
  job_seq_by_1st_stage: false
  job_seq_by_bottleneck_stage: true
  preserved_head_job_portion: 0.40
  cp_tl_nc_multiplier: 0.05
  profile_fix_by_machine: false
  machine_precedence_stride: 1
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.005
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
  use_lns_only: true
  error_if_infeasible: false
  draw_gantt: false
  max_added_batch_count: 8
  skip_if_estimated_neh_exceeds_remaining: true
  full_neh_estimate_safety_factor: 1.0
  min_remaining_nc_after_neh: 0.20
  log_cp_subproblem_bounds: true
  log_cp_subproblem_progress: false
- method: incremental_pw_cp
  batch_size_ratio: 0.05
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 8
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.008
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: incremental_pw_cp
  batch_size_ratio: 0.10
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 6
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.006
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: solve_base_cp_model_from_final_time_reserve
  computational_time: null
  solver_thread_cnt: 16
  use_lns_only: true
  consume_all_remaining: true
  cp_model_probing_level: 1
  log_search_progress: false
