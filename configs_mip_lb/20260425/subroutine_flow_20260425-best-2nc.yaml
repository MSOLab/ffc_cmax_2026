- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_dispatch_portfolio
  portfolio: "balanced"
  include_stage_agg: true
  error_if_infeasible: false
  draw_gantt: false
- method: apply_mip_lb
  precedence_formulation: "d"
  threads: 16
  tl_nc_multiplier: 0.008
  delta: 400
  es_ls_local_repair_max_passes: 3
  draw_mip_lb_visualizations: false
- method: critical_schedule_repair_ls
  max_rounds: 1
  tl_nc_multiplier: 0.004
  target_stage_mode: "all"
  stage_insertion_passes: 1
  stage_insertion_max_shift: 3
  machine_insertion_passes: 1
  max_machine_candidates_per_op: 2
  adjacent_swap_passes: 1
  max_adjacent_pairs_per_pass: 40
  error_if_infeasible: false
  draw_gantt: false
- method: apply_retained_stage_cp_lb
  retained_stage_mode: "first_topk_bottlenecks_last"
  extra_bottleneck_count: 3
  threads: 16
  tl_nc_multiplier: 0.040
  save_cp_lb_artifacts: true
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 4
  cp_local_repair_top_k: 3
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_dynamic_priority: true
  save_cp_dispatch_artifacts: true
  error_if_infeasible: false
  draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 2
  tl_nc_multiplier: 0.006
  target_stage_mode: "bottleneck_band"
  bottleneck_band_radius: 2
  stage_insertion_passes: 2
  stage_insertion_max_shift: 4
  machine_insertion_passes: 2
  max_machine_candidates_per_op: 2
  adjacent_swap_passes: 2
  max_adjacent_pairs_per_pass: 80
  error_if_infeasible: false
  draw_gantt: false
- method: neh_cp
  added_batch_size: 10
  job_seq_by_1st_stage: false
  cp_tl_nc_multiplier: 0.004
  profile_fix_by_machine: false
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.001
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  use_lns_only: true
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
- method: incremental_sw_cp
  batch_size_ratio: 0.05
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 7
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.005
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: incremental_sw_cp
  batch_size_ratio: 0.1
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 6
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.005
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: repeat_while_improvement
  n_repeats: 3
  max_no_improve: 1
  routine_data:
    - method: random_stage_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.006
      radius: 1
      min_radius: 0
      use_lns_only: false
      draw_gantt: false
    - method: critical_tail_job_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.008
      job_count: 16
      tail_stage_ratio: 0.35
      job_selection_policy: "critical_adjacency"
      use_lns_only: false
      draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 1
  tl_nc_multiplier: 0.004
  target_stage_mode: "tail"
  tail_stage_ratio: 0.35
  stage_insertion_passes: 1
  stage_insertion_max_shift: 4
  machine_insertion_passes: 1
  max_machine_candidates_per_op: 2
  adjacent_swap_passes: 2
  max_adjacent_pairs_per_pass: 80
  error_if_infeasible: false
  draw_gantt: false
- method: solve_base_cp_model
  computational_time: null
  tl_nc_multiplier: 0.080
  solver_thread_cnt: 16
  use_lns_only: false
  log_search_progress: false
- method: solve_base_cp_model
  computational_time: null
  tl_nc_multiplier: 0.060
  solver_thread_cnt: 16
  use_lns_only: true
  log_search_progress: false
- method: repeat_while_improvement
  n_repeats: 6
  max_no_improve: 2
  routine_data:
    - method: retained_cp_bottleneck_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.010
      radius: 2
      use_lns_only: false
      draw_gantt: false
    - method: critical_tail_job_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.012
      job_count: 32
      tail_stage_ratio: 0.50
      job_selection_policy: "critical_adjacency"
      use_lns_only: false
      draw_gantt: false
    - method: random_stage_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.010
      radius: 3
      min_radius: 1
      use_lns_only: false
      draw_gantt: false
- method: repeat_while_improvement
  n_repeats: 3
  max_no_improve: 1
  routine_data:
    - method: critical_tail_job_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.014
      job_count: 48
      tail_stage_ratio: 0.60
      job_selection_policy: "weighted_random"
      use_lns_only: false
      draw_gantt: false
    - method: random_stage_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.012
      radius: 4
      min_radius: 2
      use_lns_only: false
      draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 2
  tl_nc_multiplier: 0.008
  target_stage_mode: "all"
  stage_insertion_passes: 2
  stage_insertion_max_shift: 6
  machine_insertion_passes: 2
  max_machine_candidates_per_op: 3
  adjacent_swap_passes: 3
  max_adjacent_pairs_per_pass: 160
  error_if_infeasible: false
  draw_gantt: false
- method: repeat_while_improvement
  n_repeats: 4
  max_no_improve: 2
  routine_data:
    - method: retained_cp_bottleneck_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.008
      radius: 2
      use_lns_only: false
      draw_gantt: false
    - method: random_stage_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.008
      radius: 3
      min_radius: 1
      use_lns_only: false
      draw_gantt: false
    - method: critical_tail_job_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.010
      job_count: 24
      tail_stage_ratio: 0.55
      job_selection_policy: "critical_adjacency"
      use_lns_only: false
      draw_gantt: false
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 16
  use_lns_only: true
  log_search_progress: false
