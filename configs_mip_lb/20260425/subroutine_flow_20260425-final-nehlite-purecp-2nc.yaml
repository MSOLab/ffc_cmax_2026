- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_dispatch_portfolio
  portfolio: "compact"
  include_stage_agg: false
  cap_portions: [0.30]
  include_mid_order_variants: true
  randomized_mid_trials: 6
  randomized_tiebreak_trials: 6
  selection_strategy: "earliest_within_slack"
  selection_obj_slack: 0
  error_if_infeasible: false
  draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 2
  tl_nc_multiplier: 0.006
  target_stage_mode: "all"
  stage_insertion_passes: 2
  stage_insertion_max_shift: 4
  machine_insertion_passes: 2
  max_machine_candidates_per_op: 3
  adjacent_swap_passes: 2
  max_adjacent_pairs_per_pass: 100
  error_if_infeasible: false
  draw_gantt: false
- method: apply_retained_stage_cp_lb
  retained_stage_mode: "first_topk_bottlenecks_last"
  extra_bottleneck_count: 3
  threads: 16
  tl_nc_multiplier: 0.08
  snapshot_solution_limit: 64
  snapshot_log_progress: false
  save_cp_lb_artifacts: true
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 3
  cp_local_repair_top_k: 1
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_dynamic_priority: false
  randomized_mixed_rank_trials: 0
  use_retained_cp_snapshot_portfolio: true
  retained_cp_snapshot_top_k: 3
  retained_cp_dispatch_selection_strategy: "best_makespan"
  retained_cp_dispatch_makespan_slack: 0
  save_cp_dispatch_artifacts: true
  error_if_infeasible: false
  draw_gantt: false
- method: neh_cp
  added_batch_size: 12
  job_seq_by_1st_stage: false
  job_seq_by_bottleneck_stage: false
  preserved_head_job_portion: 0.0
  cp_tl_nc_multiplier: 0.008
  profile_fix_by_machine: false
  machine_precedence_stride: 1
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.002
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
  use_lns_only: false
  error_if_infeasible: false
  draw_gantt: false

