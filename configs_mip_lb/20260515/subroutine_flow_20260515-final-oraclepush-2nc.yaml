    - *safe_neh20
    - *safe_neh25
    - *safe_neh30
    - *safe_pw005
    - *safe_pw010
  - name: retained_cp_sequence_first_neh
    probe_steps:
    - method: neh_cp
      name: retained_seq_neh10_probe
      added_batch_size: 10
      job_seq_by_1st_stage: false
      job_seq_by_last_retained_cp: true
      retained_cp_sequence_fallback: bottleneck
      cp_tl_nc_multiplier: 0.006
      profile_fix_by_machine: false
      minimize_sum_ci_lex: true
      cp_tl_nc_multiplier_2nd_obj: 0.0025
      minimize_sum_ci_lin: false
      tighten_ranges: false
      link_job_completion: false
      use_lns_only: true
      make_semi_active_every_cp: true
      solver_thread_cnt: 16
      max_added_batch_count: 8
      skip_if_estimated_neh_exceeds_remaining: true
      full_neh_estimate_safety_factor: 1.0
      log_cp_subproblem_bounds: true
      log_cp_subproblem_progress: false
    suffix_steps:
    - *safe_neh15
    - *safe_neh20
    - *safe_neh25
    - *safe_neh30
    - *safe_pw005
    - *safe_pw010
  - name: interleaved_pw_neh_basin
    probe_steps:
    - method: neh_cp
      name: interleave_neh10_probe
      added_batch_size: 10
      job_seq_by_1st_stage: false
      cp_tl_nc_multiplier: 0.0075
      profile_fix_by_machine: false
      minimize_sum_ci_lex: true
      cp_tl_nc_multiplier_2nd_obj: 0.0025
      minimize_sum_ci_lin: false
      tighten_ranges: false
      link_job_completion: false
      use_lns_only: true
      make_semi_active_every_cp: true
      solver_thread_cnt: 16
      max_added_batch_count: 8
      skip_if_estimated_neh_exceeds_remaining: true
      full_neh_estimate_safety_factor: 1.0
      log_cp_subproblem_bounds: true
      log_cp_subproblem_progress: false
