- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_best_of_selected_dispatches
  left_cap_portion: 0.25
  right_cap_portion: 0.25
  normalize_by_stage_cnt: false
  randomize_mid_all: false
  reverse_mid_even: false
  reverse_mid_all: false
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: true
  head_for_all_stages: false
  p_agg_method: "sum"
  mi_agg_method: "max"
  error_if_infeasible: false
  draw_gantt: false
  method_list:
    - bn2d_all_stages
    - best_of_mixed_dispatches
- method: apply_retained_stage_cp_lb
  retained_stage_mode: "first_bottleneck_band_last"
  bottleneck_band_radius: 2
  threads: 16
  tl_nc_multiplier: 0.05
  save_cp_lb_artifacts: true
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 3
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_dynamic_priority: false
  save_cp_dispatch_artifacts: true
  error_if_infeasible: false
  draw_gantt: false
- method: neh_cp
  added_batch_size: 10
  job_seq_by_1st_stage: false
  cp_tl_nc_multiplier: 0.01
  profile_fix_by_machine: false
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.0025
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  use_lns_only: true
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
- method: incremental_pw_cp
  batch_size_ratio: 0.05
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 5
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.008
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: run_reactive_loop
  routine_data:
    - method: random_stage_band_stage_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.01
      radius: 0
      min_radius: 0
      use_lns_only: false
      draw_gantt: false
    - method: critical_tail_job_ns
      solver_thread_cnt: 16
      tl_nc_multiplier: 0.015
      job_count: 12
      tail_stage_ratio: 0.35
      job_selection_policy: "critical_adjacency"
      use_lns_only: false
      draw_gantt: false
  reactive_param_tuner_dict:
    tl_nc_multiplier:
      step_size: 0.005
      min: 0.005
      max: 0.03
    radius:
      step_size: 1
      min: 0
      max: 2
    job_count:
      step_size: 8
      min: 8
      max: 60
  stopping_criteria:
    max_loop_count: 18
    max_no_improvement_steps: 6
    stop_at_global_timelimit_minus_percent: 0.25
    rho_hits_ub: true
    tl_hits_ub: true
- method: critical_cross_machine_insertion_ls
  max_passes: 1
  tl_nc_multiplier: 0.015
  target_stage_mode: bottleneck_band
  bottleneck_band_radius: 1
  max_machine_candidates_per_op: 3
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 16
  use_lns_only: true
  log_search_progress: false
