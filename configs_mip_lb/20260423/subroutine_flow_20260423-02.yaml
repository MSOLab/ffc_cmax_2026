- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_dispatch_portfolio
  portfolio: "compact"
  include_stage_agg: false
  cap_portions: [0.30]
  include_mid_order_variants: true
  randomized_mid_trials: 40
  selection_strategy: "earliest_within_slack"
  selection_obj_slack: 1
  error_if_infeasible: false
  draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 2
  tl_nc_multiplier: 0.006
  target_stage_mode: "all"
  stage_insertion_passes: 2
  stage_insertion_max_shift: 4
  machine_insertion_passes: 2
  max_machine_candidates_per_op: 3
  adjacent_swap_passes: 2
  max_adjacent_pairs_per_pass: 100
  error_if_infeasible: false
  draw_gantt: false
- method: apply_retained_stage_cp_lb
  retained_stage_mode: "first_topk_bottlenecks_last"
  extra_bottleneck_count: 3
  threads: 16
  tl_nc_multiplier: 0.08
  snapshot_solution_limit: 64
  snapshot_log_progress: false
  save_cp_lb_artifacts: true
- method: dispatch_from_retained_cp
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: false
  respect_anchor_stage_release_lb: true
  cp_local_repair_max_passes: 5
  include_consensus_rank: true
  include_tail_bottleneck_rank: true
  include_dynamic_priority: true
  use_retained_cp_snapshot_portfolio: true
  retained_cp_snapshot_top_k: 16
  retained_cp_dispatch_selection_strategy: "earliest_snapshot_within_makespan_slack"
  retained_cp_dispatch_makespan_slack: 4
  save_cp_dispatch_artifacts: true
  error_if_infeasible: false
  draw_gantt: false
- method: neh_cp
  added_batch_size: 12
  job_seq_by_1st_stage: false
  job_seq_by_bottleneck_stage: true
  preserved_head_job_portion: 0.40
  cp_tl_nc_multiplier: 0.003
  profile_fix_by_machine: false
  machine_precedence_stride: 1
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.0008
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  make_semi_active_every_cp: true
  solver_thread_cnt: 16
  use_lns_only: false
  error_if_infeasible: false
  draw_gantt: false
- method: incremental_pw_cp
  batch_size_ratio: 0.05
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 7
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.008
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: incremental_pw_cp
  batch_size_ratio: 0.10
  unfixed_batch_count_min: 2
  unfixed_batch_count_max: 6
  increment_unfixed_batch_count_flag: if_no_improvement
  non_time_fixed_op_time_limit_multiplier: 0.008
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 16
  use_lns_only: false
- method: solve_base_cp_model
  computational_time: null
  tl_nc_multiplier: 0.12
  solver_thread_cnt: 16
  use_lns_only: false
  log_search_progress: false
- method: critical_tail_job_ns
  solver_thread_cnt: 16
  tl_nc_multiplier: 0.006
  job_count: 32
  tail_stage_ratio: 0.55
  job_selection_policy: "critical_adjacency"
  profile_fix_by_machine: false
  use_lns_only: false
  draw_gantt: false
- method: critical_schedule_repair_ls
  max_rounds: 1
  tl_nc_multiplier: 0.003
  target_stage_mode: "bottleneck_band"
  bottleneck_band_radius: 2
  stage_insertion_passes: 1
  stage_insertion_max_shift: 4
  machine_insertion_passes: 1
  max_machine_candidates_per_op: 2
  adjacent_swap_passes: 1
  max_adjacent_pairs_per_pass: 60
  error_if_infeasible: false
  draw_gantt: false
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 16
  use_lns_only: true
  log_search_progress: false
