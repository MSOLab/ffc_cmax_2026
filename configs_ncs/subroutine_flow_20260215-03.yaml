- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_best_of_dispatches
- method: bottleneck_parallel_mc_2
- method: bn2d_all_stage
  draw_gantt: False
  left_cap_multiplier: 3
  right_cap_multiplier: 3
- method: set_cp_model_as_base_cp_model
- method: neh_cp
  added_batch_size: 10
  cp_tl_c_multiplier: 0.5
  make_semi_active_every_cp: True
  solver_thread_cnt: 8
- method: run_reactive_loop
  params:
    routine_data:
      - method: operation_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        swap_before_cp: true
        seed_op_from_critical_block: true
        make_semi_active_after_cp: true
      - method: job_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        swap_before_cp: true
        seed_op_from_critical_block: true
        make_semi_active_after_cp: true
      - method: stage_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        swap_before_cp: true
        seed_stage_from_non_singleton_cb: true
        make_semi_active_after_cp: true
    reactive_param_tuner_dict:
      rho:
        step_size: 0.02
        min: 0.1
        max: 0.7
      computational_time:
        step_size: 1
        min: 1
        max: 5
    stopping_criteria:
      max_loop_count: 1000
      max_no_improvement_steps: null
      lb_gap_is_leq: 0.000001
      on_exception: "skip"
      rho_hits_ub: true
      tl_hits_ub: false
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 8
  make_semi_active_after_cp: true
