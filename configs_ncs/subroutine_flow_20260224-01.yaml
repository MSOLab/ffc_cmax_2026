- method: initialize_by_best_of_selected_dispatches
  left_cap_portion: 0.25
  right_cap_portion: 0.25
  normalize_by_stage_cnt: False
  randomize_mid_all: False
  reverse_mid_even: False
  reverse_mid_all: False
  mixed_schedule_for_former_stages: True
  mixed_schedule_for_later_stages: True
  head_for_all_stages: False
  error_if_infeasible: False
  draw_gantt: False
- method: initialize_by_job_sequence_from_stage_aggregated_problem
  stage_agg_count: 2
  head_for_all_stages: False
  head_stages_to_keep: 0
  p_agg_method: "sum"
  mi_agg_method: "max"
  error_if_infeasible: True
  draw_gantt_stage_aggregated: False
  draw_gantt: False
- method: initialize_by_job_sequence_from_stage_aggregated_problem
  stage_agg_count: 2
  head_for_all_stages: False
  head_stages_to_keep: 1
  p_agg_method: "sum"
  mi_agg_method: "max"
  error_if_infeasible: True
  draw_gantt_stage_aggregated: False
  draw_gantt: False
