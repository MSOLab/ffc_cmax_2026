- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_best_of_selected_dispatches
  left_cap_portion: 0.25
  right_cap_portion: 0.25
  normalize_by_stage_cnt: false
  randomize_mid_all: false
  reverse_mid_even: false
  reverse_mid_all: false
  mixed_schedule_for_former_stages: true
  mixed_schedule_for_later_stages: true
  machine_then_job: true
  head_for_all_stages: false
  p_agg_method: "sum"
  mi_agg_method: "max"
  error_if_infeasible: false
  draw_gantt: false
  method_list:
    - bn2d_all_stages
    - best_of_mixed_dispatches
- method: sw_cp
  batch_size_ratio: 0.10
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: sw_cp
  batch_size_ratio: 0.15
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: sw_cp
  batch_size_ratio: 0.20
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: sw_cp
  batch_size_ratio: 0.25
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: sw_cp
  batch_size_ratio: 0.30
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: sw_cp
  batch_size_ratio: 0.35
  non_time_fixed_op_time_limit_multiplier: 0.01
  lr_profile_fixed_batch_count: 1
  enable_promotion_profile_fixed: true
  solver_thread_cnt: 8
  use_lns_only: false
- method: neh_cp
  added_batch_size: 10
  job_seq_by_1st_stage: false
  cp_tl_nc_multiplier: 0.008
  profile_fix_by_machine: false
  minimize_sum_ci_lex: true
  cp_tl_nc_multiplier_2nd_obj: 0.002
  minimize_sum_ci_lin: false
  tighten_ranges: false
  link_job_completion: false
  use_lns_only: true
  make_semi_active_every_cp: true
  solver_thread_cnt: 8
- method: set_cp_model_as_base_cp_model
- method: run_reactive_loop
  params:
    routine_data:
      - method: operation_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        profile_fix_by_machine: true
        machine_precedence_stride: 1
        use_lns_only: true
        make_semi_active_after_cp: true
      - method: job_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        profile_fix_by_machine: true
        machine_precedence_stride: 1
        use_lns_only: true
        make_semi_active_after_cp: true
      - method: stage_block_ns
        rho: 0.1
        computational_time: 1
        solver_thread_cnt: 8
        profile_fix_by_machine: true
        machine_precedence_stride: 1
        use_lns_only: true
        make_semi_active_after_cp: true
    reactive_param_tuner_dict:
      rho:
        step_size: 0.01
        min: 0.1
        max: 0.5
      computational_time:
        step_size: 1
        min: 1
        max: 5
    stopping_criteria:
      max_loop_count: 1000
      max_no_improvement_steps: null
      lb_gap_is_leq: 0.000001
      on_exception: "skip"
      rho_hits_ub: false
      tl_hits_ub: false
