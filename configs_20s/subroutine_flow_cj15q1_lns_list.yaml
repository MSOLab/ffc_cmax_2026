- method: set_random_seed
  seed: 42
- method: initialize_by_cjq1
  max_time_per_add: 5
  solver_thread_cnt: 8
  error_if_infeasible: true
- method: repeat
  params:
    n_repeats: 10
    routine_data:
    - method: time_window_search
      rho: 0.2
      computational_time: 5
      solver_thread_cnt: 8
      error_if_infeasible: true
    - method: block_search
      rho: 0.2
      computational_time: 5
      solver_thread_cnt: 8
      error_if_infeasible: true
