- method: set_random_seed
  seed: 42
- method: build_jh1_solution
  max_time_per_add: 5
  num_workers: 8
  error_if_infeasible: true
  draw_gantt: true
- method: repeat
  params:
    n_repeats: 10
    routine_data:
    - method: time_window_search
      rho: 0.2
      computational_time: 5
      num_workers: 8
      error_if_infeasible: true
      draw_gantt: true
    - method: block_search
      rho: 0.2
      computational_time: 5
      num_workers: 8
      error_if_infeasible: true
      draw_gantt: true
