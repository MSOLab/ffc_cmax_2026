- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_ds_cds
- method: run_reactive_loop
  params:
    subroutine_names: [ops_block_ns, stage_ns]
    opening_kwargs:
      rho: 0.1
      computational_time: 2
      solver_thread_cnt: 8
      # error_if_infeasible: true
    reactive_param_tuner_dict:
      rho:
        step_size: 0.1
        min: 0.1
        max: 0.9
      computational_time:
        step_size: 1
        min: 1
        max: 10
    stopping_criteria:
      max_loop_count: 10
      max_no_improvement_steps: 5
      rho_is_geq: 0.9
      stop_at_global_timelimit_minus: 2
      lb_gap_is_leq: 0.000001
      on_exception: "stop"
