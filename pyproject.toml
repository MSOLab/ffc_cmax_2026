[project]
name = "hybridflowshop"
version = "0.0.1"
description = "Hybrid Flow Shop Scheduling Problem"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "mbls",
    "ortools>=9.12.4544",
    "pyyaml>=6.0.2",
    "routix==0.0.11",
    "schore==0.0.3",
]

[dependency-groups]
dev = [
    "pip>=25.1.1",
    "pytest>=8.4.1",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]

[tool.uv.sources]
mbls = { path = "../mbls" }
