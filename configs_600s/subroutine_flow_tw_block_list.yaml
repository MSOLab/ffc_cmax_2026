- method: solve_cp
  computational_time: 3
  n_threads: 8
  check_feasibility: True
  set_incumbent_solution: True
- method: repeat
  params:
    n_repeats: 30
    routine_data:
    - method: apply_time_window_search
      rho: 0.2
      computational_time: 20
      n_threads: 8
      check_feasibility: True
      update_incumbent_solution: True
    - method: apply_block_search
      rho: 0.2 # TODO: 없다면 SubroutineFlowValidator.validate()에서 걸려야 함
      computational_time: 20
      n_threads: 8
      check_feasibility: True
      update_incumbent_solution: True
