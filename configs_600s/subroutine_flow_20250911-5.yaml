- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_dj_cds
- method: initialize_by_dj_tp
- method: initialize_by_dj_gupta
- method: initialize_by_dj_palmer
- method: initialize_by_ds_cds
- method: initialize_by_ds_tp
- method: initialize_by_ds_gupta
- method: initialize_by_ds_palmer
- method: set_cp_model_as_base_cp_model
- method: neh_cp
  added_batch_size: 10
  max_time_per_add: 5
  no_improvement_timelimit: 3
  solver_thread_cnt: 8
- method: solve_base_cp_model
  computational_time: 5
  solver_thread_cnt: 8
  is_initial_solution: false
- method: run_reactive_loop
  params:
    subroutine_names: [operation_block_ns, stage_block_ns]
    opening_kwargs:
      rho: 0.1
      computational_time: 1
      solver_thread_cnt: 8
    reactive_param_tuner_dict:
      rho:
        step_size: 0.05
        min: 0.1
        max: 0.8
      computational_time:
        step_size: 1
        min: 1
        max: 10
    stopping_criteria:
      max_loop_count: 1000
      max_no_improvement_steps: null
      stop_at_global_timelimit_minus: 5.0
      lb_gap_is_leq: 0.000001
      on_exception: "skip"
      rho_hits_ub: true
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 8
  is_initial_solution: false
