- method: set_random_seed
  seed: 42
- method: apply_shdlb
- method: initialize_by_best_of_dispatches
- method: set_cp_model_as_base_cp_model
- method: neh_cp
  added_batch_size: 10
  max_time_per_add: 5
  solver_thread_cnt: 8
- method: run_reactive_loop
  params:
    routine_data:
      - method: operation_block_ns
        rho: 0.3
        computational_time: 10
        solver_thread_cnt: 8
      - method: job_block_ns
        rho: 0.3
        computational_time: 10
        solver_thread_cnt: 8
      - method: stage_block_ns
        rho: 0.3
        computational_time: 10
        solver_thread_cnt: 8
    reactive_param_tuner_dict:
      rho:
        step_size: 0
        min: 0.1
        max: 0.8
      computational_time:
        step_size: 0
        min: 1
        max: 10
    stopping_criteria:
      max_loop_count: 1000
      max_no_improvement_steps: null
      stop_at_global_timelimit_minus: 5.0
      lb_gap_is_leq: 0.000001
      on_exception: "skip"
      rho_hits_ub: true
      tl_hits_ub: false
- method: solve_base_cp_model
  computational_time: null
  solver_thread_cnt: 8
